<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="6" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0ea5e9" stroke-width="4" opacity="0.3"/>

  <!-- Optical Fiber Core Glowing Waves -->
  <path d="M128 296 C 180 230, 332 230, 384 296" fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M168 336 C 204 290, 308 290, 344 336" fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M210 376 C 228 350, 284 350, 302 376" fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Central Optical Core Node -->
  <circle cx="256" cy="216" r="32" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="256" cy="216" r="14" fill="#ffffff" />

  <!-- Signal Pulse Dots -->
  <circle cx="256" cy="142" r="8" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="340" cy="176" r="6" fill="#06b6d4" />
  <circle cx="172" cy="176" r="6" fill="#06b6d4" />
</svg>
